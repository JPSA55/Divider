<title>Divider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ============ Grain Glass UI tokens ============ */
:root{
  --paper:#f4f2ef; --surface:#fbfaf8; --surface-2:#f3ece2; --card:#fbfaf8;
  --ink:#1c1a18; --ink-2:#6b655f; --ink-3:#c3bdb6;
  --rule:#c3bdb6; --rule-2:#e8e3db;
  --accent:#b5613f; --accent-soft:#f3ece2; --accent-ink:#8f4a30; --on-accent:#fbfaf8;
  --mark:#daa343; --mark-soft:#f5ead1;
  --ok:#4f7a52; --ok-soft:#e5eee7;
  --bad:#b03a30; --bad-soft:#f5e5e1;
  --warn:#c8921a; --warn-soft:#f5ead1;
  --shadow:0 1px 3px rgba(28,26,24,.12), 0 6px 16px -8px rgba(28,26,24,.18);
  --radius:10px; --radius-sm:6px;
  --f-display:"Inter Tight","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter Tight","Segoe UI",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --rail-w:268px;
  --grain:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" result="noise"/><feColorMatrix in="noise" type="saturate" values=".3"/></filter><rect width="100" height="100" fill="%23f4f2ef" filter="url(%23n)"/></svg>');
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1a1814; --surface:#252220; --surface-2:#2d2926; --card:#252220;
    --ink:#f5f3f0; --ink-2:#a8a298; --ink-3:#6b655f;
    --rule:#6b655f; --rule-2:#3d3935;
    --accent:#d4956d; --accent-soft:#3d342b; --accent-ink:#f0d4ba; --on-accent:#252220;
    --mark:#daa343; --mark-soft:#3d3426;
    --ok:#7a9a7d; --ok-soft:#2d3a2f;
    --bad:#d66d63; --bad-soft:#3d2520;
    --warn:#d4b556; --warn-soft:#3d3426;
    --shadow:0 1px 3px rgba(0,0,0,.24), 0 6px 16px -8px rgba(0,0,0,.36);
    --grain:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" result="noise"/><feColorMatrix in="noise" type="saturate" values=".3"/></filter><rect width="100" height="100" fill="%231a1814" filter="url(%23n)"/></svg>');
  }
}
:root[data-theme="dark"]{
  --paper:#1a1814; --surface:#252220; --surface-2:#2d2926; --card:#252220;
  --ink:#f5f3f0; --ink-2:#a8a298; --ink-3:#6b655f;
  --rule:#6b655f; --rule-2:#3d3935;
  --accent:#d4956d; --accent-soft:#3d342b; --accent-ink:#f0d4ba; --on-accent:#252220;
  --mark:#daa343; --mark-soft:#3d3426;
  --ok:#7a9a7d; --ok-soft:#2d3a2f;
  --bad:#d66d63; --bad-soft:#3d2520;
  --warn:#d4b556; --warn-soft:#3d3426;
  --shadow:0 1px 3px rgba(0,0,0,.24), 0 6px 16px -8px rgba(0,0,0,.36);
  --grain:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" result="noise"/><feColorMatrix in="noise" type="saturate" values=".3"/></filter><rect width="100" height="100" fill="%231a1814" filter="url(%23n)"/></svg>');
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; font-weight:400; letter-spacing:-.3px;
  position:relative;
}
body::before{content:""; position:fixed; inset:0; pointer-events:none; opacity:.04; background-image:var(--grain); z-index:1;}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:500; text-wrap:balance; margin:0; letter-spacing:-.5px}
h1{font-size:1.9rem; line-height:1.15}
h2{font-size:1.4rem; line-height:1.2; font-weight:600}
h3{font-size:1.1rem; line-height:1.25; font-weight:600}
p{margin:0}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
::selection{background:var(--mark-soft); color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important}}

.lbl{font-family:var(--f-data); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
.num{font-family:var(--f-data); font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ buttons ============ */
.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center;
  padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--rule-2);
  background:var(--surface); color:var(--ink); cursor:pointer; font-weight:500; font-size:14px;
  transition:background .14s ease, border-color .14s ease, transform .08s ease, box-shadow .14s ease;
}
.btn:hover{background:var(--surface-2); border-color:var(--rule); box-shadow:0 2px 6px rgba(0,0,0,.06)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); box-shadow:0 2px 8px rgba(181,97,63,.18)}
.btn.primary:hover{filter:brightness(1.08); box-shadow:0 4px 12px rgba(181,97,63,.24)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2); padding:6px 9px}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink); border-color:var(--rule-2)}
.btn.danger{color:var(--bad); border-color:var(--rule-2)}
.btn.danger:hover{background:var(--bad-soft); border-color:var(--bad)}
.btn.sm{padding:5px 10px; font-size:13px}
.btn.wide{width:100%}

input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%; padding:10px 12px; border:1px solid var(--rule-2); border-radius:var(--radius-sm);
  background:var(--surface); font-size:14px; transition:border-color .14s, background .14s, box-shadow .14s;
}
input[type=text]:hover,input[type=password]:hover,input[type=number]:hover,select:hover,textarea:hover{border-color:var(--rule)}
input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(181,97,63,.1)}
textarea{resize:vertical; line-height:1.55}
label.field{display:flex; flex-direction:column; gap:5px}

/* ============ shell ============ */
#app{display:grid; grid-template-columns:var(--rail-w) minmax(0,1fr); min-height:100vh}
.rail{
  border-right:1px solid var(--rule); background:var(--surface);
  display:flex; flex-direction:column; gap:2px; padding:16px 12px 20px;
  position:sticky; top:0; height:100vh; overflow:auto;
}
.brand{display:flex; align-items:center; gap:9px; padding:2px 6px 14px}
.brand .mk{width:22px;height:26px;border-radius:2px;background:var(--accent);position:relative;flex:0 0 auto}
.brand .mk::after{content:"";position:absolute;inset:auto 4px 4px 4px;height:2px;background:var(--mark)}
.brand b{font-family:var(--f-display); font-size:19px; font-weight:700; letter-spacing:-.02em}

.rail-sec{padding:14px 6px 4px; display:flex; align-items:center; justify-content:space-between; gap:8px}
.tree{display:flex; flex-direction:column; gap:1px}
.tree .sem{margin-bottom:6px}
.tree .semhead{
  display:flex; align-items:center; gap:6px; width:100%; text-align:left; cursor:pointer;
  background:none; border:0; padding:5px 6px; border-radius:var(--radius-sm); color:var(--ink-2);
}
.tree .semhead:hover{background:var(--surface-2); color:var(--ink)}
.tree .semhead .caret{width:10px; flex:0 0 10px; color:var(--ink-3); transition:transform .15s}
.tree .semhead[aria-expanded="true"] .caret{transform:rotate(90deg)}
.tree .semhead span.nm{font-family:var(--f-data); font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:500}
.tree .courses{display:flex; flex-direction:column; gap:1px; padding-left:8px; border-left:1px solid var(--rule-2); margin-left:10px}
.tree .course{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; cursor:pointer;
  background:none; border:0; padding:6px 8px; border-radius:var(--radius-sm); color:var(--ink); font-size:14px;
}
.tree .course:hover{background:var(--surface-2)}
.tree .course[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.tree .course .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.tree .course .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rail-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--rule-2); display:flex; flex-direction:column; gap:8px}
.who{display:flex; align-items:center; gap:9px; padding:4px 6px}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
  display:grid;place-items:center;font-family:var(--f-data);font-size:12px;font-weight:600;flex:0 0 28px}
.who .nm{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.stage{min-width:0; padding:0 0 64px}
.topbar{
  position:sticky; top:0; z-index:5; background:var(--paper);
  border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:12px; padding:12px 28px; flex-wrap:wrap;
}
.crumbs{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); min-width:0; flex:1; flex-wrap:nowrap; overflow:hidden}
.crumbs > *{flex:0 0 auto; white-space:nowrap}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2);font-size:13px}
.crumbs button:hover{color:var(--ink); text-decoration:underline}
.crumbs .sep{color:var(--ink-3)}
.crumbs .cur{color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:0 1 auto}
@media (max-width:660px){ .crumbs > *:nth-child(n+3):not(:last-child){display:none} }

.wrap{max-width:1020px; margin:0 auto; padding:26px 28px 0}
.wrap.narrow{max-width:760px}
/* the margin rule of a ruled notebook — the page's left edge */
.ruled{position:relative; padding-left:26px}
.ruled::before{content:""; position:absolute; left:8px; top:2px; bottom:2px; width:1px; background:var(--mark); opacity:.5}

.page-head{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:22px}
.page-head .t{flex:1; min-width:220px; display:flex; flex-direction:column; gap:5px}
.page-head .acts{display:flex; gap:8px; flex-wrap:wrap}

.stack{display:flex; flex-direction:column; gap:14px}
.stack.lg{gap:26px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

.panel{background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--radius); padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.04)}
.panel.flat{background:transparent; border-style:dashed; box-shadow:none}
.sec-title{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap}

/* divider tabs — parciales */
.dividers{display:flex; gap:4px; align-items:flex-end; border-bottom:1px solid var(--rule); margin:4px 0 22px}
.divider{
  border:1px solid var(--rule); border-bottom:0; background:var(--surface-2); color:var(--ink-2);
  padding:9px 18px 8px; border-radius:8px 8px 0 0; cursor:pointer; position:relative; top:1px;
  font-family:var(--f-data); font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:500;
  display:flex; align-items:center; gap:8px;
}
.divider:hover{color:var(--ink)}
.divider[aria-selected="true"]{background:var(--surface); color:var(--ink); border-color:var(--rule); box-shadow:0 -2px 0 var(--accent) inset}
.divider .pill{font-size:10px; padding:1px 6px; border-radius:99px; background:var(--rule-2); color:var(--ink-2)}
.divider[aria-selected="true"] .pill{background:var(--accent-soft); color:var(--accent-ink)}

.subtabs{display:flex; gap:2px; border-bottom:1px solid var(--rule-2); margin-bottom:20px; overflow-x:auto}
.subtab{background:none;border:0;padding:8px 2px;margin-right:18px;cursor:pointer;color:var(--ink-2);
  font-size:14px; font-weight:500; white-space:nowrap; border-bottom:2px solid transparent}
.subtab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

/* cards */
.item{background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--radius); padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); transition:border-color .14s, box-shadow .14s}
.item.clickable{cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit}
.item.clickable:hover{border-color:var(--accent); box-shadow:0 4px 12px rgba(181,97,63,.12)}
.item .hd{display:flex; align-items:flex-start; gap:10px; justify-content:space-between}
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:99px; background:var(--surface-2);
  border:1px solid var(--rule-2); font-family:var(--f-data); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2)}
.chip.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.chip.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.chip.acc{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}

.empty{border:1px dashed var(--rule); border-radius:var(--radius); padding:34px 22px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--ink-2); background:var(--surface-2)}
.empty h3{color:var(--ink)}

/* meters */
.meter{height:5px; border-radius:99px; background:var(--rule-2); overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s ease}
.meter.mark i{background:var(--mark)}
.ring{--p:0; width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:0 0 46px;
  background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--rule-2) 0)}
.ring b{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-family:var(--f-data);font-size:11px;font-weight:600}

/* modality picker */
.modgrid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}
.mod{border:1px solid var(--rule); border-radius:var(--radius); padding:13px 14px; background:var(--surface);
  cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:5px; font:inherit; color:inherit}
.mod:hover{border-color:var(--accent); background:var(--accent-soft)}
.mod[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent)}
.mod .gl{font-family:var(--f-data); font-size:11px; color:var(--accent-ink); letter-spacing:.06em}
.mod b{font-size:14.5px; font-weight:600}
.mod small{color:var(--ink-2); font-size:12.5px; line-height:1.4}

/* modal */
.scrim{position:fixed; inset:0; background:rgba(28,26,24,.35); backdrop-filter:blur(8px); z-index:40;
  display:grid; place-items:center; padding:18px; overflow:auto}
.modal{background:var(--surface); border:1px solid var(--rule-2); border-radius:14px; box-shadow:0 20px 40px -8px rgba(28,26,24,.24), 0 1px 3px rgba(28,26,24,.12);
  width:min(680px,100%); max-height:min(88vh,900px); display:flex; flex-direction:column; overflow:hidden; backdrop-filter:blur(16px)}
.modal header{padding:18px 20px 14px; border-bottom:1px solid var(--rule-2); display:flex; align-items:center; justify-content:space-between; gap:12px}
.modal .body{padding:18px 20px; overflow:auto; display:flex; flex-direction:column; gap:14px}
.modal footer{padding:14px 20px; border-top:1px solid var(--rule-2); display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap}

/* toast */
#toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{background:var(--ink); color:var(--paper); padding:9px 15px; border-radius:99px; font-size:13.5px; box-shadow:var(--shadow); max-width:min(92vw,520px)}
.toast.bad{background:var(--bad); color:#fff}

/* auth */
.auth{min-height:100vh; display:grid; place-items:center; padding:24px}
.authbox{width:min(460px,100%); display:flex; flex-direction:column; gap:18px}
.prof{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 14px; border-radius:var(--radius);
  border:1px solid var(--rule); background:var(--surface); cursor:pointer; font:inherit; color:inherit}
.prof:hover{border-color:var(--accent)}

/* study surfaces */
.qcard{background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; gap:14px}
.opt{display:flex; gap:11px; align-items:flex-start; padding:11px 13px; border:1px solid var(--rule); border-radius:var(--radius-sm);
  background:var(--surface); cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit; transition:border-color .12s, background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-data); font-size:12px; color:var(--ink-3); flex:0 0 auto; margin-top:2px}
.opt.correct{border-color:var(--ok); background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.why{border-left:3px solid var(--mark); background:var(--mark-soft); padding:10px 13px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; font-size:14px}
.why.ok{border-color:var(--ok); background:var(--ok-soft)}
.why.bad{border-color:var(--bad); background:var(--bad-soft)}

.flash{perspective:1400px}
.flash .inner{position:relative; min-height:230px; transition:transform .5s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius); border:1px solid var(--rule);
  background:var(--card); padding:34px 28px 28px; display:flex; flex-direction:column; justify-content:center; gap:12px; text-align:center;
  box-shadow:var(--shadow); overflow:auto}
.flash .face.back{transform:rotateY(180deg); background:var(--surface)}
.flash .face::before{content:""; position:absolute; left:22px; right:22px; top:18px; height:1px; background:var(--rule-2)}
.flash .face .lbl{position:absolute; top:22px; left:0; right:0; text-align:center}

.tl{position:relative; padding-left:26px}
.tl::before{content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--rule)}
.tl .ev{position:relative; padding-bottom:22px}
.tl .ev::before{content:""; position:absolute; left:-24px; top:6px; width:11px; height:11px; border-radius:50%;
  background:var(--surface); border:2px solid var(--accent)}
.tl .ev .dt{font-family:var(--f-data); font-size:12px; color:var(--accent-ink); font-weight:600; letter-spacing:.02em}

.matchcols{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.matchcols .col{display:flex; flex-direction:column; gap:8px}
.mitem{padding:10px 12px; border:1px solid var(--rule); border-radius:var(--radius-sm); background:var(--surface);
  cursor:pointer; text-align:left; font:inherit; color:inherit; font-size:14px; line-height:1.4}
.mitem:hover:not([disabled]){border-color:var(--accent)}
.mitem[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.mitem.done{opacity:.45; cursor:default; border-style:dashed}
.mitem.miss{border-color:var(--bad); background:var(--bad-soft)}

.tree-map{font-size:14px}
.tree-map ul{list-style:none; margin:0; padding-left:20px; border-left:1px solid var(--rule); display:flex; flex-direction:column; gap:8px}
.tree-map > ul{border-left:0; padding-left:0}
.tree-map li{position:relative}
.tree-map li > .nodebox{background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:8px 11px; display:inline-block; max-width:100%}
.tree-map ul ul li::before{content:""; position:absolute; left:-20px; top:17px; width:14px; height:1px; background:var(--rule)}
.tree-map .nodebox b{font-weight:600}
.tree-map .nodebox small{display:block; color:var(--ink-2); font-size:12.5px; margin-top:2px}

.tblwrap{overflow-x:auto; border:1px solid var(--rule); border-radius:var(--radius); background:var(--surface)}
table.cmp{border-collapse:collapse; width:100%; font-size:14px; min-width:520px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--rule-2); padding:10px 13px; text-align:left; vertical-align:top}
table.cmp thead th{background:var(--surface-2); font-family:var(--f-data); font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2); font-weight:500}
table.cmp tbody th{font-weight:600; width:1%; white-space:nowrap}

.notes h3{margin-top:4px}
.notes .sect{border-left:2px solid var(--rule); padding-left:16px; display:flex; flex-direction:column; gap:9px}
.notes ul{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:6px}
.notes .terms{display:flex; flex-wrap:wrap; gap:7px}
.notes .terms .t{background:var(--surface-2); border:1px solid var(--rule-2); border-radius:var(--radius-sm); padding:6px 10px; font-size:13px}
.notes .terms .t b{font-weight:600}

.progbar{display:flex; gap:3px; flex-wrap:wrap}
.progbar i{width:9px; height:9px; border-radius:2px; background:var(--rule-2)}
.progbar i.ok{background:var(--ok)}
.progbar i.bad{background:var(--bad)}
.progbar i.cur{background:var(--accent)}

.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.transcript{background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--radius-sm);
  padding:14px; max-height:300px; overflow:auto; font-size:14.5px; line-height:1.6; white-space:pre-wrap}
.transcript .interim{color:var(--ink-3)}

.loading{display:flex; align-items:center; gap:10px; color:var(--ink-2); font-size:14px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--rule); border-top-color:var(--accent); animation:sp .8s linear infinite; flex:0 0 15px}
@keyframes sp{to{transform:rotate(360deg)}}

.filedrop{border:1px dashed var(--rule); border-radius:var(--radius); padding:26px; text-align:center; background:var(--surface-2); cursor:pointer}
.filedrop.over{border-color:var(--accent); background:var(--accent-soft)}

.kbd{font-family:var(--f-data); font-size:11px; border:1px solid var(--rule); border-bottom-width:2px; border-radius:4px; padding:1px 5px; color:var(--ink-2); background:var(--surface)}

.railtoggle{display:none}

/* ============ responsive ============ */
@media (max-width: 880px){
  #app{grid-template-columns:1fr}
  .rail{position:fixed; inset:0 auto 0 0; width:min(84vw,300px); z-index:50; transform:translateX(-102%);
    transition:transform .22s ease; box-shadow:var(--shadow); height:100dvh}
  body.rail-open .rail{transform:none}
  body.rail-open::after{content:""; position:fixed; inset:0; background:rgba(12,20,18,.4); z-index:45}
  .railtoggle{display:inline-flex}
  .wrap{padding:20px 16px 0}
  .topbar{padding:10px 16px}
  .matchcols{grid-template-columns:1fr}
  h1{font-size:1.55rem}
}
@media (max-width: 440px){
  .grid,.grid.wide,.modgrid{grid-template-columns:1fr}
  .dividers{overflow-x:auto}
  .ruled{padding-left:18px}
  .ruled::before{left:4px}
}
</style>

<div id="modal-root"></div>
