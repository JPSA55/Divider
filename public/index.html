<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divider - Study Set Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --accent: #b5613f;
      --accent-soft: rgba(181,97,63,.1);
      --paper: #f4f2ef;
      --ink: #2d2820;
    }
    
    body {
      font-family: 'Inter Tight', sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }
    
    #app { min-height: 100vh; padding: 20px; }
    
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    .auth-box {
      text-align: center;
      max-width: 400px;
      padding: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(45,40,32,.08);
    }
    
    .brand { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .tagline { font-size: 14px; color: #666; margin-bottom: 30px; }
    
    .btn {
      display: block;
      width: 100%;
      padding: 12px 20px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    
    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
    
    .btn-secondary {
      background: white;
      color: var(--accent);
      border: 2px solid var(--accent);
    }
    
    .btn-tertiary {
      background: transparent;
      color: var(--accent);
      text-decoration: underline;
    }
    
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 12px; padding: 30px; box-shadow: 0 10px 40px rgba(45,40,32,.15); z-index: 1000; }
    .modal.active { display: block; }
    
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
    }
    
    input:focus, textarea:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
